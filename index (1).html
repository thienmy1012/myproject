<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý Deadline — CPC1HN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0f1117;
  --bg2: #171923;
  --bg3: #1e2433;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #e8eaf0;
  --text2: #8b91a8;
  --text3: #555d7a;
  --accent: #4f8ef7;
  --accent2: #3a72d8;
  --green: #34d298;
  --green-bg: rgba(52,210,152,0.12);
  --amber: #f5a623;
  --amber-bg: rgba(245,166,35,0.12);
  --red: #f05c5c;
  --red-bg: rgba(240,92,92,0.12);
  --purple: #a78bfa;
  --purple-bg: rgba(167,139,250,0.12);
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Be Vietnam Pro', sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --webhook: 'https://n8n.cpc1hn.com/webhook/ec6f3126-f0eb-4364-a9a3-b3980378beee';
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
}

/* ── LOGIN SCREEN ── */
#login-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}
#login-screen::before {
  content: '';
  position: absolute;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(79,142,247,0.08) 0%, transparent 70%);
  top: -100px; left: -100px;
  pointer-events: none;
}
#login-screen::after {
  content: '';
  position: absolute;
  width: 400px; height: 400px;
  background: radial-gradient(circle, rgba(167,139,250,0.06) 0%, transparent 70%);
  bottom: -50px; right: 0;
  pointer-events: none;
}

.login-card {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 20px;
  padding: 40px 44px;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  animation: fadeUp 0.5s ease;
}
@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}

.login-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}
.login-logo .dot {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff;
}
.login-logo span {
  font-size: 16px; font-weight: 600; color: var(--text);
  letter-spacing: -0.3px;
}

.login-card h2 {
  font-size: 22px; font-weight: 700;
  color: var(--text);
  margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.login-card p.sub {
  color: var(--text2); font-size: 13px; margin-bottom: 28px;
}

.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12px; font-weight: 600;
  color: var(--text2);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus { border-color: var(--accent); }
.form-group input::placeholder { color: var(--text3); }

.btn-login {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 12px;
  font-family: var(--font);
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  margin-top: 8px;
  transition: background 0.2s, transform 0.1s;
}
.btn-login:hover { background: var(--accent2); }
.btn-login:active { transform: scale(0.99); }
.btn-login:disabled { opacity: 0.5; cursor: not-allowed; }

.login-error {
  background: var(--red-bg);
  border: 1px solid rgba(240,92,92,0.3);
  border-radius: var(--radius-sm);
  color: var(--red);
  padding: 10px 14px;
  font-size: 13px;
  margin-top: 12px;
  display: none;
}

/* ── APP LAYOUT ── */
#app { display: none; min-height: 100vh; flex-direction: column; }

/* TOPBAR */
.topbar {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 0 28px;
  height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 100;
}
.topbar-left {
  display: flex; align-items: center; gap: 12px;
}
.topbar-logo {
  width: 28px; height: 28px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff;
}
.topbar-title {
  font-size: 14px; font-weight: 600;
  color: var(--text);
  letter-spacing: -0.3px;
}

.topbar-right {
  display: flex; align-items: center; gap: 16px;
}
.user-badge {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 12px 5px 5px;
  cursor: pointer;
}
.user-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 700; color: #fff;
}
.user-name { font-size: 12px; font-weight: 500; color: var(--text2); }
.role-badge { font-size: 10px; font-weight: bold; padding: 1px 5px; border-radius: 4px; text-transform: uppercase; margin-left: 2px;}
.role-admin { background: rgba(245,166,35,0.2); color: var(--amber); }
.role-user { background: rgba(79,142,247,0.2); color: var(--accent); }

.btn-logout {
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text2);
  padding: 5px 12px;
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
}
.btn-logout:hover { border-color: var(--red); color: var(--red); }

.btn-refresh {
  background: none;
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--accent);
  padding: 5px 12px;
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  font-family: var(--font);
  display: flex; align-items: center; gap: 5px;
}
.btn-refresh:hover { background: rgba(79,142,247,0.1); }
.btn-refresh.spinning svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MAIN CONTENT */
.main { padding: 28px; max-width: 1500px; margin: 0 auto; width: 100%; }

/* STATS ROW */
.stats-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}
.stat-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
}
.stat-card.blue::before  { background: var(--accent); }
.stat-card.green::before { background: var(--green); }
.stat-card.amber::before { background: var(--amber); }
.stat-card.red::before   { background: var(--red); }

.stat-label { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
.stat-card.blue  .stat-value { color: var(--accent); }
.stat-card.green .stat-value { color: var(--green); }
.stat-card.amber .stat-value { color: var(--amber); }
.stat-card.red   .stat-value { color: var(--red); }
.stat-sub { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* FILTER BAR */
.filter-bar {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.filter-bar input[type=text] {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  color: var(--text);
  font-family: var(--font);
  font-size: 13px;
  outline: none;
  width: 280px;
  transition: border-color 0.2s;
}
.filter-bar input[type=text]:focus { border-color: var(--accent); }
.filter-bar input[type=text]::placeholder { color: var(--text3); }

.filter-btn {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 6px 14px;
  color: var(--text2);
  font-family: var(--font);
  font-size: 12px; font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--border2); color: var(--text); }
.filter-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

/* TABLE */
.table-wrap {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.table-header-row {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.table-title { font-size: 13px; font-weight: 600; color: var(--text); }
.table-count { font-size: 11px; color: var(--text3); font-family: var(--mono); }

table {
  width: 100%;
  border-collapse: collapse;
}
th {
  background: var(--bg3);
  padding: 12px 16px;
  text-align: left;
  font-size: 11px; font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
td {
  padding: 13px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: middle;
}
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(255,255,255,0.02); }

.task-name { font-weight: 600; color: var(--text); }
.task-sub-info { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: var(--mono); }
.task-owner { color: var(--text); font-weight: 500; }
.task-dept { color: var(--text2); font-size: 12px; }
.task-my { color: var(--accent); font-size: 10px; font-weight: 600; background: rgba(79,142,247,0.12); padding: 2px 6px; border-radius: 4px; margin-left: 6px; }

.date-cell { font-family: var(--mono); font-size: 12px; color: var(--text2); }
.date-warn { color: var(--amber); font-weight: 500; }
.date-over { color: var(--red); font-weight: 500; }
.date-ok   { color: var(--green); }

/* STATUS BADGE */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 20px;
  font-size: 11px; font-weight: 600;
  white-space: nowrap;
}
.badge.todo     { background: var(--bg3); color: var(--text2); border: 1px solid var(--border); }
.badge.doing    { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,166,35,0.25); }
.badge.done     { background: var(--green-bg); color: var(--green); border: 1px solid rgba(52,210,152,0.25); }
.badge.overdue  { background: var(--red-bg); color: var(--red); border: 1px solid rgba(240,92,92,0.25); }

.badge::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}

/* ACTION BUTTONS */
.action-row { display: flex; gap: 6px; align-items: center; }
.btn-action {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 11px; font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font);
  color: var(--text2);
  white-space: nowrap;
}
.btn-action:hover { border-color: var(--border2); color: var(--text); }
.btn-action.doing  { color: var(--amber); border-color: rgba(245,166,35,0.3); }
.btn-action.doing:hover { background: var(--amber-bg); }
.btn-action.done   { color: var(--green); border-color: rgba(52,210,152,0.3); }
.btn-action.done:hover { background: var(--green-bg); }
.btn-action.report { color: var(--purple); border-color: rgba(167,139,250,0.3); }
.btn-action.report:hover { background: var(--purple-bg); }
.btn-action:disabled { opacity: 0.35; cursor: not-allowed; }

/* DAYS LEFT CHIP */
.days-chip {
  font-family: var(--mono);
  font-size: 11px; font-weight: 500;
  padding: 3px 8px;
  border-radius: 6px;
  display: inline-block;
}
.days-chip.ok     { background: var(--green-bg); color: var(--green); }
.days-chip.warn   { background: var(--amber-bg); color: var(--amber); }
.days-chip.danger { background: var(--red-bg); color: var(--red); }
.days-chip.done   { background: var(--bg3); color: var(--text3); }

/* EMPTY / LOADING */
.loading-row td, .empty-row td {
  text-align: center;
  padding: 48px;
  color: var(--text3);
  font-size: 13px;
}
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 12px;
}

/* TIMELINE CHIPS inside table */
.timeline-cell { display: flex; flex-direction: column; gap: 4px; min-width: 190px; }
.tl-item { font-size: 11px; font-family: var(--mono); }
.tl-label { color: var(--text3); font-size: 11px; }

/* TOAST */
.toast-wrap {
  position: fixed;
  bottom: 24px; right: 24px;
  z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px 18px;
  font-size: 13px;
  color: var(--text);
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  display: flex; align-items: center; gap: 10px;
  animation: toastIn 0.3s ease;
  pointer-events: all;
  min-width: 260px;
}
.toast.success .ti { color: var(--green); }
.toast.error   .ti { color: var(--red); }
.toast.info    .ti { color: var(--accent); }
@keyframes toastIn { from { opacity:0; transform: translateX(20px); } to { opacity:1; transform: translateX(0); } }
@keyframes toastOut { to { opacity:0; transform: translateX(20px); } }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border2);
  border-radius: 16px;
  padding: 28px 32px;
  width: 90%;
  max-width: 440px;
  animation: fadeUp 0.25s ease;
}
.modal h3 { font-size: 17px; font-
