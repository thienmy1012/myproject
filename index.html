<script>
// ══ CONFIG ══════════════════════════════════════════
const WEBHOOK = 'https://n8n.cpc1hn.com/webhook/ec6f3126-f0eb-4364-a9a3-b3980378beee';

const USERS = [
  { email:'mytnt.qa@cpc1hn.com', password:'cpc1hn@2025', name:'My',  displayName:'My (MYTNT)' },
  { email:'nhiph.qa@cpc1hn.com', password:'cpc1hn@2025', name:'Nhi', displayName:'Nhi (NHIPH)' },
];

let me = null, tasks = [], tab = 'all', pendingTask = null, pendingStatus = null;

// HÀM XỬ LÝ NGÀY THÁNG CHUẨN VIỆT NAM (DD/MM/YYYY)
function parseViDate(s) {
  if (!s || s === 'Trống' || s.includes('CHƯA') || s.includes('Chưa')) return null;
  const parts = s.split('/');
  if (parts.length === 3) {
    const d = parseInt(parts[0], 10);
    const m = parseInt(parts[1], 10) - 1;
    const y = parseInt(parts[2], 10);
    return new Date(y, m, d);
  }
  const dFallback = new Date(s);
  return isNaN(dFallback.getTime()) ? null : dFallback;
}

// ── AUTH ──────────────────────────────────────────
function initSession(){
  const s = sessionStorage.getItem('qa_user');
  if(s){ me = JSON.parse(s); showApp(); loadTasks(); }
}

function doLogin(){
  const email = document.getElementById('inp-email').value.trim().toLowerCase();
  const pass  = document.getElementById('inp-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display='none';
  const u = USERS.find(x=>x.email.toLowerCase()===email && x.password===pass);
  if(!u){ errEl.textContent='Email hoặc mật khẩu không đúng.'; errEl.style.display='block'; return; }
  me = u;
  sessionStorage.setItem('qa_user', JSON.stringify(u));
  const btn=document.getElementById('btn-login');
  btn.disabled=true; btn.textContent='Đang vào...';
  setTimeout(()=>{ btn.disabled=false; btn.textContent='Đăng nhập'; showApp(); loadTasks(); },300);
}

document.addEventListener('keydown', e=>{
  if(e.key==='Enter' && document.getElementById('login-screen').style.display!=='none') doLogin();
});

function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  document.getElementById('top-avatar').textContent = me.name.charAt(0).toUpperCase();
  document.getElementById('top-uname').textContent = me.displayName;
}

function doLogout(){
  sessionStorage.removeItem('qa_user');
  me=null; tasks=[];
  document.getElementById('login-screen').style.display='';
  document.getElementById('app').style.display='none';
  document.getElementById('inp-pass').value='';
}

// ── LOAD FROM N8N ─────────────────────────────────
async function loadTasks(){
  const btn = document.getElementById('btn-refresh');
  btn.classList.add('spinning');
  document.getElementById('tbody').innerHTML =
    '<tr class="loading-row"><td colspan="7"><div class="spinner-wrap"><div class="spinner"></div>Đang tải từ n8n...</div></td></tr>';
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=>ctrl.abort(), 10000);
    const url = WEBHOOK + '?action=get_tasks&user=' + encodeURIComponent(me.email);
    const res = await fetch(url, { method:'GET', signal: ctrl.signal });
    clearTimeout(timer);
    const raw = await res.json();
    tasks = Array.isArray(raw) ? raw : (raw.tasks || raw.data || []);
    if(!tasks.length){ tasks = demo(); showToast('Chưa có dữ liệu từ n8n — đang hiển thị mẫu','info'); }
    else showToast('Đã tải '+tasks.length+' công việc','success');
  }catch(e){
    tasks = demo();
    showToast('Không kết nối được n8n — đang dùng dữ liệu mẫu','info');
  }
  updateStats(); render();
  btn.classList.remove('spinning');
}

function demo(){
  const t=new Date(), d=(n)=>{ const x=new Date(t); x.setDate(x.getDate()+n); return x.getDate()+'/'+(x.getMonth()+1)+'/'+x.getFullYear(); };
  return [
    {Ma_thiet_bi:'TBA-001',Ten_thiet_bi:'TBA 110kV Tân Bình',Noi_dung_tham_dinh:'Thẩm định cải tạo',QA_phu_trach:'My',Bo_phan_khac:'Phòng Kỹ thuật',Thoi_han_cuoi:d(45),Ngay_chuan_bi_de_cuong:d(15),Ngay_thuc_hien_tham_dinh:d(25),Ngay_hoan_thanh_bao_cao:d(40),Trang_thai:'doing'},
  ];
}

// ── STATS ─────────────────────────────────────────
function updateStats(){
  const now=new Date(); now.setHours(0,0,0,0);
  const in30=new Date(now); in30.setDate(in30.getDate()+30);
  let soon=0,over=0,done=0;
  tasks.forEach(t=>{
    if(t.Trang_thai==='done'){done++;return;}
    const dl = parseViDate(t.Thoi_han_cuoi);
    if(!dl) return;
    if(dl<now) over++;
    else if(dl<=in30) soon++;
  });
  document.getElementById('s-total').textContent=tasks.length;
  document.getElementById('s-soon').textContent=soon;
  document.getElementById('s-over').textContent=over;
  document.getElementById('s-done').textContent=done;
}

// ── TAB ───────────────────────────────────────────
function setTab(t,el){
  tab=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  render();
}

// ── RENDER ────────────────────────────────────────
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const now=new Date(); now.setHours(0,0,0,0);
  const in30=new Date(now); in30.setDate(in30.getDate()+30);

  const list = tasks.filter(t=>{
    const dl = parseViDate(t.Thoi_han_cuoi);
    const isOver = t.Trang_thai!=='done' && dl && dl<now;
    const match = !q || [t.Ten_thiet_bi,t.Ma_thiet_bi,t.Noi_dung_tham_dinh,t.QA_phu_trach,t.Bo_phan_khac]
      .some(v=>(v||'').toLowerCase().includes(q));
    if(!match) return false;
    if(tab==='mine')    return isMine(t);
    if(tab==='overdue') return isOver;
    if(tab==='soon')    return !isOver && dl && dl>=now && dl<=in30 && t.Trang_thai!=='done';
    if(tab==='done')    return t.Trang_thai==='done';
    return true;
  });

  document.getElementById('tbl-count').textContent = list.length+' công việc';
  const tbody=document.getElementById('tbody');
  if(!list.length){ tbody.innerHTML='<tr class="empty-row"><td colspan="7">Không tìm thấy công việc nào</td></tr>'; return; }

  tbody.innerHTML = list.map(t=>{
    const now2=new Date(); now2.setHours(0,0,0,0);
    const dl = parseViDate(t.Thoi_han_cuoi);
    const dLeft = dl ? Math.round((dl-now2)/86400000) : null;
    const isOver = t.Trang_thai!=='done' && dLeft!==null && dLeft<0;
    const status = isOver ? 'overdue' : (t.Trang_thai||'todo');
    const mine = isMine(t);

    let chip;
    if(t.Trang_thai==='done')       chip='<span class="chip done">✓ Xong</span>';
    else if(dLeft===null)            chip='<span class="chip" style="background:var(--bg3);color:var(--text3)">Chưa có</span>';
    else if(dLeft<0)                 chip=`<span class="chip danger">QH ${Math.abs(dLeft)}n</span>`;
    else if(dLeft<=7)                chip=`<span class="chip danger">${dLeft} ngày</span>`;
    else if(dLeft<=30)               chip=`<span class="chip warn">${dLeft} ngày</span>`;
    else                             chip=`<span class="chip ok">${dLeft} ngày</span>`;

    const badges={todo:'<span class="badge todo">Chờ xử lý</span>',doing:'<span class="badge doing">Đang làm</span>',done:'<span class="badge done">Hoàn thành</span>',overdue:'<span class="badge overdue">Quá hạn</span>'};

    const fd = s => {
      const dd = parseViDate(s);
      if(!dd) return '<span class="date-cell date-muted">' + (s||'Chưa có') + '</span>';
      const now3=new Date(); now3.setHours(0,0,0,0);
      const diff=Math.round((dd-now3)/86400000);
      let cls='date-cell';
      if(diff<0) cls+=' date-danger'; else if(diff<=7) cls+=' date-warn'; else cls+=' date-ok';
      const dStr = dd.getDate().toString().padStart(2,'0') + '/' + (dd.getMonth()+1).toString().padStart(2,'0') + '/' + dd.getFullYear();
      return `<span class="${cls}">${dStr}</span>`;
    };

    const ms=`<div class="ms-wrap">
      <div class="ms-row"><span class="ms-icon">📝</span><span class="ms-label">Đề cương</span>${fd(t.Ngay_chuan_bi_de_cuong)}</div>
      <div class="ms-row"><span class="ms-icon">🔍</span><span class="ms-label">Thẩm định</span>${fd(t.Ngay_thuc_hien_tham_dinh)}</div>
      <div class="ms-row"><span class="ms-icon">📄</span><span class="ms-label">Báo cáo</span>${fd(t.Ngay_hoan_thanh_bao_cao)}</div>
    </div>`;

    const ownerTag = mine ? `<span class="owner-mine">👤 ${t.QA_phu_trach||'—'}</span>` : `<span class="owner-other">👤 ${t.QA_phu_trach||'—'}</span>`;

    let actions = !mine ? '<span class="readonly-label">Chỉ xem</span>' : `<div class="action-row"><button class="btn-a" onclick="openModal('${escId(t)}')">✏️ Cập nhật</button></div>`;

    return `<tr>
      <td><div class="task-name">${t.Ten_thiet_bi||'—'}</div><div class="task-code">${t.Ma_thiet_bi||''}</div><div class="task-dept">${t.Noi_dung_tham_dinh||''}</div></td>
      <td>${ownerTag}<div style="font-size:11px;color:var(--text3);margin-top:4px">${t.Bo_phan_khac||''}</div></td>
      <td>${fd(t.Thoi_han_cuoi)}</td>
      <td>${ms}</td>
      <td>${chip}</td>
      <td>${badges[status]||badges.todo}</td>
      <td>${actions}</td>
    </tr>`;
  }).join('');
}

function isMine(t){
  if(!me) return false;
  const qa=(t.QA_phu_trach||'').toLowerCase().trim();
  if(!qa || qa==='chưa phân công' || qa==='chưa có' || qa==='trống') return false;
  const myName=me.name.toLowerCase(), myEmail=me.email.toLowerCase();
  return qa===myName || qa===myEmail || myEmail.startsWith(qa) || qa.includes(myName);
}
function escId(t){ return encodeURIComponent(t.Ma_thiet_bi||t.Ten_thiet_bi||''); }
function taskById(id){ return tasks.find(t=>encodeURIComponent(t.Ma_thiet_bi||t.Ten_thiet_bi||'')===id); }

function openModal(id){
  const t=taskById(id);
  if(!t) return;
  pendingTask=t; pendingStatus=t.Trang_thai||'todo';
  const p = parseViDate(t.Thoi_han_cuoi);
  const dlStr = p ? p.getDate().toString().padStart(2,'0')+'/'+(p.getMonth()+1).toString().padStart(2,'0')+'/'+p.getFullYear() : 'Chưa có';
  document.getElementById('modal-info').innerHTML=`<strong>${t.Ten_thiet_bi}</strong><br>${t.Noi_dung_tham_dinh||''}<br>Mã: ${t.Ma_thiet_bi||'—'} &nbsp;|&nbsp; Deadline: <strong>${dlStr}</strong>`;
  selectStatus(pendingStatus);
  document.getElementById('modal').classList.add('open');
}

function selectStatus(s){
  pendingStatus=s;
  ['todo','doing','done'].forEach(x=>{ document.getElementById('opt-'+x).className='status-opt '+x+(x===s?' selected':''); });
}

function closeModal(){ document.getElementById('modal').classList.remove('open'); pendingTask=null; pendingStatus=null; }

async function confirmUpdate(){
  if(!pendingTask||!pendingStatus) return;
  const btn=document.getElementById('btn-confirm');
  btn.disabled=true; btn.textContent='Đang lưu...';
  try{
    const params = new URLSearchParams({ action:'update_status', Ma_thiet_bi: pendingTask.Ma_thiet_bi||'', Ten_thiet_bi: pendingTask.Ten_thiet_bi||'', Trang_thai: pendingStatus, user: me.email, userName: me.name, timestamp: new Date().toISOString() });
    await fetch(WEBHOOK + '?' + params.toString(), { method:'GET' });
    showToast('Đã cập nhật trạng thái thành công','success');
  }catch(e){ showToast('Lỗi kết nối n8n — trạng thái chỉ cập nhật tạm thời','info'); }
  pendingTask.Trang_thai=pendingStatus; updateStats(); render();
  btn.disabled=false; btn.textContent='Xác nhận'; closeModal();
}

document.getElementById('modal').addEventListener('click',function(e){ if(e.target===this) closeModal(); });

function showToast(msg,type='info'){
  const icon={success:'✅',error:'❌',info:'ℹ️'};
  const wrap=document.getElementById('toasts');
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML=`<span class="ti">${icon[type]||'ℹ️'}</span>${msg}`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.animation='toastOut 0.3s ease forwards'; setTimeout(()=>el.remove(),300); },3500);
}

initSession();
</script>
